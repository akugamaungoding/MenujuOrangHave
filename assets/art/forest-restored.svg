<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-labelledby="forest-restored-title forest-restored-desc">
  <title id="forest-restored-title">The Regrowth - Forest Restored and Hope Awakened</title>
  <desc id="forest-restored-desc">A hopeful watercolor landscape of the forest regrowing with fresh tender green shoots, vibrant returning canopies, crystal waters in warm dawn light, and animal friends returning home.</desc>
  <defs>
    <!-- Soft watercolor bleed filter -->
    <filter id="wc-filter-scene-restored" x="-5%" y="-5%" width="110%" height="110%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.5" result="softened" />
      <feMerge>
        <feMergeNode in="softened" />
        <feMergeNode in="SourceGraphic" opacity="0.7" />
      </feMerge>
    </filter>

    <!-- Hopeful Golden Dawn Sky Gradient -->
    <linearGradient id="grad-dawn-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3" />
      <stop offset="35%" stop-color="#F7E2B5" />
      <stop offset="70%" stop-color="#E8B584" />
      <stop offset="100%" stop-color="#FDF6E3" />
    </linearGradient>

    <!-- Restored Vibrant Canopies -->
    <linearGradient id="grad-restored-distant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5CCA5" />
      <stop offset="100%" stop-color="#6B8F5E" />
    </linearGradient>

    <linearGradient id="grad-restored-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7AA36E" />
      <stop offset="50%" stop-color="#4A7C59" />
      <stop offset="100%" stop-color="#345E41" />
    </linearGradient>

    <!-- Fresh Sapling Lime-Green Gradient -->
    <linearGradient id="grad-fresh-shoots" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B2E09B" />
      <stop offset="60%" stop-color="#8BB87D" />
      <stop offset="100%" stop-color="#4A7C59" />
    </linearGradient>

    <!-- Clear Shimmering River Gradient -->
    <linearGradient id="grad-clear-river" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7EFE3" />
      <stop offset="50%" stop-color="#85BAA1" />
      <stop offset="100%" stop-color="#5B8E73" />
    </linearGradient>

    <radialGradient id="grad-hopeful-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#F5E6C8" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#E8956A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FDF6E3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Golden Dawn Sky Canvas -->
  <rect id="dawn-sky" width="800" height="500" fill="url(#grad-dawn-sky)" />

  <!-- Radiant Rising Dawn Sun -->
  <circle id="golden-sun" cx="440" cy="180" r="160" fill="url(#grad-hopeful-sun)" />

  <g id="restored-landscape" filter="url(#wc-filter-scene-restored)">
    <!-- Peaceful Distant Mountain Ridges Bathed in Light -->
    <path id="restored-ridge-1" d="M0 240 Q160 170 340 210 T700 175 Q760 190 800 205 L800 350 L0 350 Z" fill="#C2D8C7" opacity="0.7" />
    <path id="restored-ridge-2" d="M0 220 Q200 255 420 195 T800 225 L800 380 L0 380 Z" fill="#A8CBB0" opacity="0.8" />

    <!-- Distant Forest Ridges Returning to Life -->
    <g id="distant-greenery" fill="url(#grad-restored-distant)">
      <circle cx="60" cy="235" r="45" />
      <circle cx="120" cy="230" r="50" />
      <circle cx="180" cy="240" r="45" />
      <circle cx="240" cy="225" r="55" />
      <circle cx="310" cy="235" r="50" />
      <circle cx="380" cy="220" r="60" />
      <circle cx="450" cy="230" r="52" />
      <circle cx="530" cy="225" r="55" />
      <circle cx="610" cy="235" r="48" />
      <circle cx="680" cy="220" r="56" />
      <circle cx="750" cy="230" r="52" />
      <rect x="0" y="235" width="800" height="100" />
    </g>

    <!-- Clear Healing River -->
    <path id="healing-river" d="M480 260 C460 290 490 320 450 350 C410 380 340 395 310 430 C270 475 290 500 290 500 L440 500 C470 470 480 435 530 400 C580 360 550 310 540 270 Z" fill="url(#grad-clear-river)" />
    <!-- Golden Dawn River Highlights -->
    <path d="M475 285 C485 305 470 325 450 345" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M415 375 C370 395 345 425 330 460" stroke="#FFFDF7" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Midground Regrowing Canopy with Fresh Sprouts -->
    <g id="midground-regrowth" fill="url(#grad-restored-mid)">
      <path d="M-20 380 C0 310 60 270 120 280 C180 290 220 330 250 390 C220 420 120 440 -20 420 Z" />
      <circle cx="70" cy="285" r="55" />
      <circle cx="150" cy="300" r="62" />
      <circle cx="210" cy="325" r="50" />

      <path d="M520 390 C560 300 640 270 720 285 C780 295 820 330 830 410 C750 430 630 420 520 390 Z" />
      <circle cx="590" cy="300" r="58" />
      <circle cx="670" cy="285" r="65" />
      <circle cx="750" cy="305" r="60" />
    </g>

    <!-- Foreground Regenerated Trees & Saplings -->
    <g id="foreground-life">
      <!-- Ancient Resilient Trunk with Green Shoots Sprouting from it -->
      <path d="M-30 500 L35 340 C45 300 65 240 70 180 L105 180 C95 240 85 300 95 340 L130 500 Z" fill="#4B392C" />
      <!-- Fresh Green Sprouting Vines on Trunk -->
      <path d="M45 420 Q65 380 50 340 T75 280" stroke="#8BB87D" stroke-width="3" fill="none" />
      <circle cx="53" cy="390" r="4.5" fill="#B2E09B" />
      <circle cx="60" cy="350" r="5" fill="#B2E09B" />
      <circle cx="68" cy="305" r="4.5" fill="#B2E09B" />

      <!-- Lush Canopies Overhead with golden highlights -->
      <g fill="#4A7C59">
        <circle cx="60" cy="150" r="75" />
        <circle cx="130" cy="120" r="80" />
        <circle cx="190" cy="160" r="65" />
        <circle cx="110" cy="190" r="70" />
      </g>
      <!-- Sunlit leaf canopy clusters -->
      <circle cx="130" cy="115" r="50" fill="#6B8F5E" />
      <circle cx="160" cy="140" r="40" fill="#8BB87D" opacity="0.8" />

      <!-- Right Foreground Canopy Restored -->
      <g fill="#4A7C59">
        <circle cx="750" cy="140" r="85" />
        <circle cx="680" cy="165" r="70" />
        <circle cx="770" cy="220" r="75" />
        <circle cx="640" cy="210" r="55" />
      </g>
      <circle cx="680" cy="155" r="45" fill="#6B8F5E" />
      <path d="M770 500 L740 310 L780 300 L810 500 Z" fill="#4B392C" />

      <!-- Healthy Riverbanks Covered in Fresh Greenery -->
      <ellipse cx="200" cy="495" rx="70" ry="25" fill="#4A7C59" />
      <ellipse cx="600" cy="490" rx="90" ry="30" fill="#4A7C59" />
      <ellipse cx="680" cy="485" rx="60" ry="25" fill="#6B8F5E" />

      <!-- Fresh Young Saplings & Shoots (Symbols of Regeneration) -->
      <g id="fresh-shoots">
        <!-- Sapling 1 on left bank -->
        <path d="M165 475 Q168 440 170 420" stroke="#4A7C59" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M170 420 C155 410 155 425 170 420 C185 415 185 430 170 420 Z" fill="url(#grad-fresh-shoots)" />
        <path d="M168 435 C156 430 158 442 168 435" fill="url(#grad-fresh-shoots)" />
        <circle cx="170" cy="415" r="3.5" fill="#B2E09B" />

        <!-- Sapling 2 on right bank -->
        <path d="M575 465 Q578 430 580 405" stroke="#4A7C59" stroke-width="3" stroke-linecap="round" fill="none" />
        <path d="M580 405 C565 395 565 412 580 405 C595 398 595 415 580 405 Z" fill="url(#grad-fresh-shoots)" />
        <path d="M579 425 C568 420 570 432 579 425" fill="url(#grad-fresh-shoots)" />
        <path d="M580 435 C592 430 590 442 580 435" fill="url(#grad-fresh-shoots)" />

        <!-- Tiny Ferns & Wild Sprouting Flora -->
        <path d="M220 480 Q235 460 250 470" stroke="#8BB87D" stroke-width="2" fill="none" />
        <path d="M640 475 Q655 455 670 465" stroke="#8BB87D" stroke-width="2" fill="none" />
      </g>
    </g>

    <!-- Character Silhouettes visible in the distance returning home -->
    <g id="character-silhouettes">
      <!-- 1. Tuki (Orangutan) in high canopy branch on left, holding up a leaf -->
      <g id="sil-tuki" transform="translate(165, 130) scale(0.18)">
        <!-- Head and body silhouette -->
        <circle cx="30" cy="20" r="18" fill="#C26735" />
        <ellipse cx="32" cy="48" rx="22" ry="20" fill="#B35222" />
        <path d="M12 40 Q5 25 18 10" stroke="#C26735" stroke-width="6" stroke-linecap="round" fill="none" />
        <circle cx="20" cy="5" r="8" fill="#8BB87D" /> <!-- Leaf in hand -->
      </g>

      <!-- 2. Rangkong (Hornbill) perched proudly on a high right branch facing dawn -->
      <g id="sil-hornbill" transform="translate(620, 185) scale(0.16)">
        <ellipse cx="30" cy="30" rx="14" ry="18" fill="#282625" />
        <circle cx="22" cy="14" r="10" fill="#282625" />
        <!-- Distinctive casque profile -->
        <path d="M16 10 C10 4 2 8 0 12 C10 14 18 14 20 12 Z" fill="#E07B39" />
        <path d="M0 12 C-8 15 -18 20 -22 25 C-12 23 2 18 8 16 Z" fill="#D4A574" />
        <path d="M40 45 L55 75 L48 75 Z" fill="#FFFDF7" /> <!-- Tail feather -->
      </g>

      <!-- 3. Kecil (Mouse deer) drinking peacefully at the gentle river's edge -->
      <g id="sil-mousedeer" transform="translate(345, 410) scale(0.14)">
        <ellipse cx="25" cy="18" rx="18" ry="12" fill="#9C4C1B" />
        <path d="M10 15 L2 28 L5 29 L14 18 Z" fill="#9C4C1B" /> <!-- Front leg -->
        <path d="M35 18 L38 32 L41 32 L36 18 Z" fill="#9C4C1B" /> <!-- Back leg -->
        <circle cx="8" cy="10" r="8" fill="#C87034" /> <!-- Head down drinking -->
        <path d="M3 6 L0 2 L5 4 Z" fill="#C87034" /> <!-- Ear -->
      </g>
    </g>

    <!-- Hopeful Golden Light Beams Crossing the Sky -->
    <g id="dawn-rays" opacity="0.25" fill="#FFFDF7">
      <polygon points="440,180 200,500 270,500" />
      <polygon points="440,180 380,500 460,500" />
      <polygon points="440,180 580,500 660,500" />
      <polygon points="440,180 720,450 780,480" />
    </g>

    <!-- Golden Spores of New Life floating in dawn air -->
    <g id="golden-spores">
      <circle cx="480" cy="320" r="2.5" fill="#FFFDF7" />
      <circle cx="480" cy="320" r="6" fill="#F5E6C8" opacity="0.5" />
      <circle cx="520" cy="270" r="2" fill="#FFFDF7" />
      <circle cx="520" cy="270" r="5" fill="#F5E6C8" opacity="0.4" />
      <circle cx="360" cy="360" r="2" fill="#FFFDF7" />
      <circle cx="360" cy="360" r="5" fill="#F5E6C8" opacity="0.4" />
      <circle cx="280" cy="410" r="2.5" fill="#FFFDF7" />
      <circle cx="280" cy="410" r="6" fill="#F5E6C8" opacity="0.5" />
    </g>
  </g>
</svg>
