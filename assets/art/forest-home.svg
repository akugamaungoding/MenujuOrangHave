<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-labelledby="forest-home-title forest-home-desc">
  <title id="forest-home-title">Sanctuary - Lush Kalimantan Forest</title>
  <desc id="forest-home-desc">A warm watercolor landscape of an ancient Kalimantan rainforest with layered green canopies, winding river, and peaceful morning mist.</desc>
  <defs>
    <!-- Soft watercolor bleed filter -->
    <filter id="wc-filter-scene-home" x="-5%" y="-5%" width="110%" height="110%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.6" result="softened" />
      <feMerge>
        <feMergeNode in="softened" />
        <feMergeNode in="SourceGraphic" opacity="0.65" />
      </feMerge>
    </filter>

    <!-- Warm Morning Sky Gradient -->
    <linearGradient id="grad-home-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3" />
      <stop offset="50%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#E8D5B0" />
    </linearGradient>

    <!-- Distant Forest Ridge Gradients -->
    <linearGradient id="grad-canopy-distant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93B89B" />
      <stop offset="100%" stop-color="#6B8F5E" />
    </linearGradient>

    <!-- Midground Canopy Gradient -->
    <linearGradient id="grad-canopy-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B8F5E" />
      <stop offset="60%" stop-color="#4A7C59" />
      <stop offset="100%" stop-color="#345E41" />
    </linearGradient>

    <!-- Foreground Dense Canopy Gradient -->
    <linearGradient id="grad-canopy-fore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7C59" />
      <stop offset="50%" stop-color="#355E3B" />
      <stop offset="100%" stop-color="#234229" />
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="grad-river" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B2D4C3" />
      <stop offset="50%" stop-color="#7EA993" />
      <stop offset="100%" stop-color="#558169" />
    </linearGradient>

    <radialGradient id="grad-sun-warmth" cx="65%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F5E6C8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FDF6E3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect id="sky-backdrop" width="800" height="500" fill="url(#grad-home-sky)" />

  <!-- Morning Sun Gentle Glow -->
  <circle id="morning-sun-glow" cx="520" cy="140" r="180" fill="url(#grad-sun-warmth)" />

  <g id="forest-layers" filter="url(#wc-filter-scene-home)">
    <!-- Distant Mountain Ridges & Soft Hills -->
    <path id="distant-ridge-1" d="M0 240 Q160 170 340 215 T700 180 Q760 195 800 210 L800 350 L0 350 Z" fill="#B5CEB9" opacity="0.6" />
    <path id="distant-ridge-2" d="M0 220 Q200 260 420 200 T800 230 L800 380 L0 380 Z" fill="#9CBD9F" opacity="0.75" />

    <!-- Distant Forest Layer (Soft tree blobs) -->
    <g id="distant-canopy" fill="url(#grad-canopy-distant)">
      <circle cx="60" cy="240" r="45" />
      <circle cx="120" cy="235" r="50" />
      <circle cx="180" cy="245" r="45" />
      <circle cx="240" cy="230" r="55" />
      <circle cx="310" cy="240" r="50" />
      <circle cx="380" cy="225" r="60" />
      <circle cx="450" cy="235" r="52" />
      <circle cx="530" cy="230" r="55" />
      <circle cx="610" cy="240" r="48" />
      <circle cx="680" cy="225" r="56" />
      <circle cx="750" cy="235" r="52" />
      <rect x="0" y="240" width="800" height="100" />
    </g>

    <!-- Safe Mist Layer drifting through mid-canopy -->
    <path id="mist-layer-1" d="M0 270 C200 240 400 280 600 250 C700 235 760 255 800 260 L800 300 L0 300 Z" fill="#FDF6E3" opacity="0.45" />

    <!-- Meandering Forest River -->
    <path id="river" d="M480 260 C460 290 490 320 450 350 C410 380 340 395 310 430 C270 475 290 500 290 500 L440 500 C470 470 480 435 530 400 C580 360 550 310 540 270 Z" fill="url(#grad-river)" />
    <!-- River light reflections -->
    <path d="M470 290 C480 310 465 330 445 350" stroke="#FFFDF7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M410 380 C365 400 340 430 325 465" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Midground Forest Canopy (Warm lush moss) -->
    <g id="midground-forest" fill="url(#grad-canopy-mid)">
      <!-- Left Bank Mid Trees -->
      <path d="M-20 380 C0 310 60 270 120 280 C180 290 220 330 250 390 C220 420 120 440 -20 420 Z" />
      <circle cx="70" cy="290" r="55" />
      <circle cx="150" cy="305" r="62" />
      <circle cx="210" cy="330" r="50" />

      <!-- Right Bank Mid Trees -->
      <path d="M520 390 C560 300 640 270 720 285 C780 295 820 330 830 410 C750 430 630 420 520 390 Z" />
      <circle cx="590" cy="305" r="58" />
      <circle cx="670" cy="290" r="65" />
      <circle cx="750" cy="310" r="60" />
    </g>

    <!-- Foreground Grand Dipterocarp Trees (Safe, Ancient Guardians) -->
    <g id="foreground-trees">
      <!-- Left Giant Trunk & Branches -->
      <path d="M-30 500 L35 340 C45 300 65 240 70 180 L105 180 C95 240 85 300 95 340 L130 500 Z" fill="#422F22" />
      <!-- Lichen on trunk -->
      <path d="M50 360 Q65 340 60 310" stroke="#6B8F5E" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M75 420 Q88 390 80 370" stroke="#8BB87D" stroke-width="3.5" stroke-linecap="round" fill="none" />

      <!-- Giant Left Canopy Blobs -->
      <g fill="url(#grad-canopy-fore)">
        <circle cx="60" cy="150" r="75" />
        <circle cx="130" cy="120" r="80" />
        <circle cx="190" cy="160" r="65" />
        <circle cx="110" cy="190" r="70" />
        <circle cx="40" cy="210" r="60" />
      </g>

      <!-- Hanging Vines & Lianas -->
      <path d="M70 180 Q90 260 65 330" stroke="#355E3B" stroke-width="2.5" fill="none" />
      <path d="M120 190 Q150 250 135 300" stroke="#4A7C59" stroke-width="2" fill="none" />
      <path d="M150 170 Q130 230 160 280" stroke="#355E3B" stroke-width="2" fill="none" />

      <!-- Right Foreground Canopy -->
      <g fill="url(#grad-canopy-fore)">
        <circle cx="750" cy="140" r="85" />
        <circle cx="680" cy="165" r="70" />
        <circle cx="770" cy="220" r="75" />
        <circle cx="640" cy="210" r="55" />
      </g>
      <!-- Right Trunk Peeking -->
      <path d="M770 500 L740 310 L780 300 L810 500 Z" fill="#422F22" />

      <!-- Bottom Riverbank Lush Undergrowth -->
      <g id="flora-details">
        <!-- Ferns on left bank -->
        <path d="M40 480 Q90 440 140 455" stroke="#4A7C59" stroke-width="4" stroke-linecap="round" fill="none" />
        <path d="M60 485 Q110 450 165 470" stroke="#6B8F5E" stroke-width="3.5" stroke-linecap="round" fill="none" />
        <!-- Fern frond leaves -->
        <circle cx="100" cy="450" r="7" fill="#6B8F5E" />
        <circle cx="120" cy="452" r="6" fill="#8BB87D" />
        <circle cx="140" cy="455" r="5" fill="#4A7C59" />

        <!-- Riverbank moss mounds -->
        <ellipse cx="200" cy="495" rx="70" ry="25" fill="#355E3B" />
        <ellipse cx="600" cy="490" rx="90" ry="30" fill="#355E3B" />
        <ellipse cx="680" cy="485" rx="60" ry="25" fill="#4A7C59" />

        <!-- Warm Amber Fireflies / Golden Forest Spores in safe air -->
        <circle cx="280" cy="340" r="2.5" fill="#FFFDF7" opacity="0.9" />
        <circle cx="280" cy="340" r="6" fill="#E8956A" opacity="0.4" />
        <circle cx="360" cy="290" r="2" fill="#FFFDF7" opacity="0.8" />
        <circle cx="360" cy="290" r="5" fill="#E8956A" opacity="0.35" />
        <circle cx="560" cy="360" r="2.5" fill="#FFFDF7" opacity="0.9" />
        <circle cx="560" cy="360" r="6" fill="#E8956A" opacity="0.4" />
      </g>
    </g>

    <!-- Soft Morning Light Rays Filtering through Left Canopy -->
    <g id="god-rays" opacity="0.2" fill="#FFFDF7">
      <polygon points="120,130 300,500 240,500" />
      <polygon points="170,140 440,500 370,500" />
      <polygon points="210,160 560,500 500,500" />
    </g>
  </g>
</svg>
